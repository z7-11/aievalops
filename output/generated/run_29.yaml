description: AIEvalOps Python 客服接口自动评测
prompts:
- '{{question}}'
providers:
- id: http
  label: python-customer-service-api
  config:
    url: http://127.0.0.1:3001/api/chat
    method: POST
    headers:
      Content-Type: application/json
    body:
      question: '{{prompt}}'
    transformResponse: json.answer
tests:
- description: refund-001 | 退款 | P0
  vars:
    question: 商品签收后7天可以退款吗？
  assert:
  - type: contains
    value: 7天
    metric: answer_accuracy
  - type: contains
    value: 退款
    metric: answer_accuracy
  - type: latency
    threshold: 3000
    metric: response_latency
